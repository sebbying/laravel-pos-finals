name: Laravel checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, pdo_sqlite, fileinfo, xml, dom
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: find app bootstrap config database routes tests public -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan test
